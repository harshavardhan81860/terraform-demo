name: Terraform Infra Deployment

on:
  push:
    branches: [ "main", "dev", "preprod", "prod" ]
    paths:
      - '**.tf'           # Triggers only when root Terraform files change
      - 'modules/**'      # Triggers when infrastructure module files change
  pull_request:
    branches: [ "main", "dev", "preprod", "prod" ]
    paths:
      - '**.tf'
      - 'modules/**'

permissions:
  contents: read
  pull-requests: write    # Allows GitHub Actions to post plan details into PR comments

jobs:
  terraform:
    name: Terraform Pipeline
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-south-1" # Mumbai region (matches your availability_zone "ap-south-1a")

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color
        continue-on-error: false

      # Appends plan details straight into your pull requests for review
      - name: Post Plan to Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Format & Style 🖌 \`${{ steps.fmt.outcome }}\`
            #### Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Plan Output 📖 \`${{ steps.plan.outcome }}\`

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Runs apply automatically only during a direct merge or push to branches
      - name: Terraform Apply
        if: github.event_name == 'push'
        id: apply
        run: terraform apply -auto-approve
