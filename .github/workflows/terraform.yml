name: Terragrunt Infra Deployment

on:
  push:
    branches: [ "main", "dev", "preprod", "prod" ]
    paths:
      - 'environments/**'
      - 'modules/**'

jobs:
  terragrunt:
    name: Terragrunt GitOps Run
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "ap-south-1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # Install Terragrunt engine binaries onto the automation execution host
      - name: Setup Terragrunt
        uses: alpine-github-actions/terragrunt@v3
        with:
          terragrunt_version: "v0.55.0"

      # Dynamically maps execution down to the target environment subdirectory matching your current Git branch name
      - name: Terragrunt Plan & Apply
        run: |
          cd environments/${{ github.ref_name }}
          terragrunt run-all plan --terragrunt-non-interactive
          terragrunt run-all apply --terragrunt-non-interactive -auto-approve
